# ========================================
# Переменные для апгрейда Kubernetes кластера
# ========================================

# Целевая версия кластера (патч-точно)
k8s_target: "v1.36.3"

# Debian-версия пакетов в pkgs.k8s.io (без начального "v")
k8s_package_version: "1.36.3-1.1"

# Источник Kubernetes-пакетов: local или repo.
# Local остаётся безопасным offline-режимом по умолчанию.
k8s_package_source: "local"
k8s_local_deb_dir: "/tmp"
k8s_package_arch: "amd64"
k8s_local_deb_packages:
  kubeadm: "{{ k8s_local_deb_dir }}/kubeadm_{{ k8s_package_version }}_{{ k8s_package_arch }}.deb"
  kubelet: "{{ k8s_local_deb_dir }}/kubelet_{{ k8s_package_version }}_{{ k8s_package_arch }}.deb"
  kubectl: "{{ k8s_local_deb_dir }}/kubectl_{{ k8s_package_version }}_{{ k8s_package_arch }}.deb"

# Минор для репозитория pkgs.k8s.io

k8s_minor: "v1.36"



# Кто выполняет kubectl drain/uncordon (выбор любого доступного мастера, кроме текущего)
k8s_ctl_host: "{{ (groups['masters'] | reject('equalto', inventory_hostname) | list | first) | default(groups['masters'][0]) }}"

# Административный kubeconfig kubeadm control-plane
k8s_admin_kubeconfig: "/etc/kubernetes/admin.conf"

# Имена нод в кластере (если совпадают с inventory)
#k8s_node_name: "{{ inventory_hostname }}"

# Если имена в Kubernetes ≠ inventory, включай автодетект
auto_detect_node_name: false

# ========================================
# CRI настройки: containerd
# ========================================
cri_socket: "unix:///run/containerd/containerd.sock"
configure_containerd: false
pause_image: "registry.k8s.io/pause:3.10"

# Проверки для K8s 1.35
require_cgroup_v2: true
require_containerd_2: true

# ========================================
# Таймауты операций
# ========================================
drain_timeout: "15m"
wait_ready_timeout: "10m"
kubeadm_api_timeout: "60s"

# По умолчанию drain соблюдает PodDisruptionBudget. Включать только осознанно.
drain_disable_eviction: false

# Необязательная точная версия containerd.io. Пустая строка = доступная версия.
containerd_package_version: ""
