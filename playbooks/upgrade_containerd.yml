---
# ============================================================================
# Плейбук для обновления containerd 1.7.x → 2.0.x
# ============================================================================

- name: Pre-flight checks
  hosts: masters[0]
  gather_facts: false
  become: false
  tasks:
    - name: Check cluster is healthy
      shell: |
        kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{" "}{range .status.conditions[?(@.type=="Ready")]}{.status}{"\n"}{end}{end}' |
        awk '$2 != "True" { count++ } END { print count + 0 }'
      register: not_ready_nodes
      changed_when: false
      failed_when: (not_ready_nodes.stdout | int) != 0

    - name: Display cluster state
      shell: kubectl get nodes -o wide
      register: nodes_state
      changed_when: false

    - debug:
        msg: "{{ nodes_state.stdout_lines }}"

    - name: Confirm containerd upgrade
      pause:
        prompt: |
          
          ========================================
          ОБНОВЛЕНИЕ CONTAINERD 1.7 → 2.0
          ========================================
          
          Это обновит containerd на ВСЕХ нодах по очереди.
          Каждая нода будет:
          1. Drain (эвакуация подов)
          2. Обновление containerd
          3. Рестарт containerd + kubelet
          4. Uncordon (возврат в работу)
          
          ⚠️  Процесс безопасен, но займёт время!
          
          Нажмите Enter для продолжения или Ctrl+C для отмены...

# ============================================================================
# Обновление containerd на CONTROL-PLANE нодах (по одной)
# ============================================================================
- name: Upgrade containerd on control-plane nodes
  hosts: masters
  serial: 1
  become: true
  tasks:
    - name: Get current containerd version
      shell: "containerd --version | awk '{print $3}' | cut -d'v' -f2"
      register: current_containerd
      changed_when: false

    - debug:
        msg: "Текущая версия containerd на {{ inventory_hostname }}: {{ current_containerd.stdout }}"

    - name: Check if upgrade needed
      set_fact:
        needs_upgrade: "{{ current_containerd.stdout.split('.')[0] | int < 2 }}"

    - name: Initialize drain state
      set_fact:
        node_drained: false

    - block:
        - name: Add Docker repository GPG key
          shell: |
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            chmod a+r /etc/apt/keyrings/docker.asc
          args:
            creates: /etc/apt/keyrings/docker.asc

        - name: Add Docker repository
          shell: |
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          args:
            creates: /etc/apt/sources.list.d/docker.list

        - name: Update apt cache before draining the node
          apt:
            update_cache: yes

        - name: Verify requested containerd package is available
          shell: |
            if test -n '{{ containerd_package_version }}'; then
              apt-cache madison containerd.io | awk '{print $3}' | grep -Fx -- '{{ containerd_package_version }}'
            else
              apt-cache policy containerd.io | awk '/Candidate:/ { if ($2 != "(none)") found=1 } END { exit !found }'
            fi
          changed_when: false

        - name: Drain node
          command: >
            kubectl drain {{ hostvars[inventory_hostname].k8s_node_name }}
            --ignore-daemonsets --delete-emptydir-data
            --grace-period=60 --timeout=15m
            {{ '--disable-eviction' if drain_disable_eviction | bool else '' }}
          delegate_to: "{{ groups['masters'][0] }}"
          register: drain_result
          retries: 3
          delay: 30
          until: drain_result.rc == 0

        - name: Record successful drain
          set_fact:
            node_drained: true

        - name: Stop kubelet
          service:
            name: kubelet
            state: stopped

        - name: Stop containerd
          service:
            name: containerd
            state: stopped

        - name: Check containerd config
          stat:
            path: /etc/containerd/config.toml
          register: containerd_config

        - name: Backup containerd config
          copy:
            src: /etc/containerd/config.toml
            dest: /etc/containerd/config.toml.backup-{{ ansible_date_time.epoch }}
            remote_src: yes
          when: containerd_config.stat.exists

        - name: Upgrade containerd to 2.0+
          apt:
            name: "{{ 'containerd.io=' ~ containerd_package_version if containerd_package_version | length > 0 else 'containerd.io' }}"
            state: "{{ 'present' if containerd_package_version | length > 0 else 'latest' }}"

        - name: Verify new containerd version
          shell: "containerd --version | awk '{print $3}' | cut -d'v' -f2"
          register: new_containerd
          changed_when: false

        - name: Check upgrade success
          assert:
            that:
              - (new_containerd.stdout.split('.')[0] | int) >= 2
            fail_msg: "Не удалось обновить containerd до 2.0+. Текущая версия: {{ new_containerd.stdout }}"
            success_msg: "containerd успешно обновлён до {{ new_containerd.stdout }}"

        - name: Regenerate default containerd config
          shell: |
            if test -f /etc/containerd/config.toml; then
              mv /etc/containerd/config.toml /etc/containerd/config.toml.old-{{ ansible_date_time.epoch }}
            fi
            containerd config default > /etc/containerd/config.toml

        - name: Ensure SystemdCgroup = true
          replace:
            path: /etc/containerd/config.toml
            regexp: 'SystemdCgroup\s*=\s*false'
            replace: 'SystemdCgroup = true'

        - name: Set correct pause image
          replace:
            path: /etc/containerd/config.toml
            regexp: 'sandbox_image\s*=\s*".*"'
            replace: 'sandbox_image = "registry.k8s.io/pause:3.10"'

        - name: Ensure CRI plugin is enabled
          shell: "grep -E 'disabled_plugins\\s*=.*\"cri\"' -q /etc/containerd/config.toml && echo BAD || echo OK"
          register: cri_check
          changed_when: false
          failed_when: cri_check.stdout == "BAD"

        - name: Start containerd
          service:
            name: containerd
            state: started
            enabled: true

        - name: Wait for containerd to be ready
          shell: "ctr version || crictl version"
          register: containerd_ready
          retries: 10
          delay: 3
          until: containerd_ready.rc == 0
          changed_when: false

        - name: Start kubelet
          service:
            name: kubelet
            state: started
            enabled: true

        - name: Wait for kubelet to be active
          shell: systemctl is-active kubelet
          register: kubelet_active
          retries: 10
          delay: 5
          until: kubelet_active.stdout == "active"
          changed_when: false

        - name: Wait for node to be Ready
          command: >
            kubectl wait node/{{ hostvars[inventory_hostname].k8s_node_name }}
            --for=condition=Ready --timeout=10m
          delegate_to: "{{ groups['masters'][0] }}"
          register: wait_ready
          retries: 3
          delay: 10
          until: wait_ready.rc == 0

        - name: Uncordon node
          command: "kubectl uncordon {{ hostvars[inventory_hostname].k8s_node_name }}"
          delegate_to: "{{ groups['masters'][0] }}"

        - debug:
            msg: "✅ Нода {{ inventory_hostname }} обновлена: containerd {{ current_containerd.stdout }} → {{ new_containerd.stdout }}"

        - name: Pause between control-plane nodes
          pause:
            seconds: 30
            prompt: "Пауза 30 секунд перед следующей control-plane нодой..."
      rescue:
        - name: Check whether a containerd backup was created
          stat:
            path: /etc/containerd/config.toml.backup-{{ ansible_date_time.epoch }}
          register: containerd_backup
          when: node_drained | bool

        - name: Restore containerd configuration after a failed upgrade
          copy:
            src: /etc/containerd/config.toml.backup-{{ ansible_date_time.epoch }}
            dest: /etc/containerd/config.toml
            remote_src: yes
          when:
            - node_drained | bool
            - containerd_backup.stat.exists | default(false)

        - name: Try to start containerd after a failed upgrade
          service:
            name: containerd
            state: started
          failed_when: false
          when: node_drained | bool

        - name: Try to start kubelet after a failed upgrade
          service:
            name: kubelet
            state: started
          failed_when: false
          when: node_drained | bool

        - name: Abort and keep the failed node cordoned
          fail:
            msg: >-
              Обновление containerd на {{ inventory_hostname }} не завершено.
              {{ 'Конфигурация по возможности восстановлена, службы запущены, нода оставлена cordoned.' if node_drained | bool else 'Ошибка возникла до drain; состояние ноды не менялось.' }}
      when: needs_upgrade | bool

    - name: Skip if already on 2.0+
      debug:
        msg: "⏭️  Нода {{ inventory_hostname }} уже на containerd {{ current_containerd.stdout }}, пропускаем"
      when: not (needs_upgrade | bool)

