# ============================================================================
# Финальная проверка
# ============================================================================
- name: Verify containerd upgrade
  hosts: masters[0]
  gather_facts: false
  become: false
  tasks:
    - name: Check all nodes are Ready
      shell: |
        kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{" "}{range .status.conditions[?(@.type=="Ready")]}{.status}{"\n"}{end}{end}' |
        awk '$2 != "True" { count++ } END { print count + 0 }'
      register: not_ready_final
      changed_when: false
      failed_when: (not_ready_final.stdout | int) != 0

    - name: Display final cluster state
      command: kubectl get nodes -o wide
      register: final_state
      changed_when: false

    - name: Get containerd versions from all nodes
      shell: |
        for node in $(kubectl get nodes -o name | cut -d/ -f2); do
          version=$(kubectl get node $node -o jsonpath='{.status.nodeInfo.containerRuntimeVersion}')
          echo "$node: $version"
        done
      register: containerd_versions
      changed_when: false

    - name: SUCCESS - containerd upgrade completed
      debug:
        msg:
          - "=========================================="
          - "✅ CONTAINERD ОБНОВЛЁН УСПЕШНО!"
          - "=========================================="
          - "Все ноды в состоянии Ready"
          - ""
          - "Версии containerd по нодам:"
          - "{{ containerd_versions.stdout_lines }}"
          - ""
          - "Состояние кластера:"
          - "{{ final_state.stdout }}"
          - "=========================================="
          - ""
          - "🚀 Теперь можно обновлять Kubernetes до {{ k8s_target }}!"
          - ""
          - "Следующий шаг:"
          - "ansible-playbook playbooks/k8s-upgrade-1.36.yml"
          - "=========================================="
